amazon_price: "$99.95"
cogniterra_url: "https://cogniterra.org/a/64"
cogniterra_price: "$79.95"
coursera_url: "https://www.coursera.org/specializations/bioinformatics"
youtube_url: "https://www.youtube.com/channel/UCKSUVRs2N2FdDNvQoRWKhoQ"
contact_email: activelearningpublishers@gmail.com
isbn: ""  # add the 3rd edition ISBN-13 here once confirmed
