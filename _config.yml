title: Bioinformatics Algorithms
tagline: "An Active Learning Approach"
description: "Bioinformatics Algorithms, the bestselling textbook by Phillip Compeau and Pavel Pevzner. Read the first five chapters free, watch the lecture videos, and learn bioinformatics by solving real problems."
url: "https://bioinformaticsalgorithms.com"  # PREVIEW. Set to https://www.bioinformaticsalgorithms.org at cutover.
