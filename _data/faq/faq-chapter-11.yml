- q: Why do we include only masses of prefix and suffix subpeptides in the ideal spectrum of a peptide (e.g., RED or DCA for REDCA)? Why don't we include masses of other subpeptides (like EDC)?
  a: <p>Internal subpeptides like EDC of REDCA require two bonds (before E and after C) to be broken to generate the fragment ion. In contrast, prefix and suffix subpeptides require only one bond to be broken. As a result, although internal subpeptides correspond to some fragment ions, we ignore them because they are much less common than the fragment ions generated by prefix and suffix subpeptides.</p>
- q: Why do the heights of some peaks in DinosaurSpectrum correlate so poorly with the corresponding amplitudes in the spectral vector?
  a: '<p>DinosaurSpectrum is reproduced below (top), along with its spectral vector (bottom).</p>

    <p class="figure"><img src="/assets/images/faq/988d7f_86fa3f4950084714aca4db524d2fff53_mv2.png" alt="Figure" loading="lazy"></p>

    <p class="figure"><img src="/assets/images/faq/988d7f_32ac1f3d635d43029e6f045986d594b9_mv2.png" alt="Figure" loading="lazy"></p>

    <p>The transformation of a spectrum into a spectral vector is a complex process that takes into account many factors in addition to the heights of peaks. For details of this transformation, see <a href="https://pubs.acs.org/doi/abs/10.1021/pr8001244" target="_blank" rel="noopener">Kim et al., 2008..</a></p>'
- q: How do we infer the charges of annotated peaks in a spectrum?
  a: '<p>For example, how did we annotate the tall peak y12++ as having charge +2 in the figure below (one of the annotations of DinosaurSpectrum)?</p>

    <p class="figure"><img src="/assets/images/faq/988d7f_d99313e071344ada85049012ba10f622_mv2.png" alt="Figure" loading="lazy"></p>

    <p>As described in the main text, mass spectrometers measure the mass-to-charge ratio rather than the mass of fragment ions. Thus, a peak in a spectrum with a given mass-to-charge ratio <em>m/z</em> gives rise to various masses depending on its (unknown) charge z. If one of the resulting masses matches a mass in the theoretical spectrum, we may infer that the peak has charge z.</p>'
- q: How does the use of rounded (integer) masses of amino acids diminish our ability to accurately sequence peptides?
  a: <p>Although we rounded amino acid masses to integers to simplify the presentation, proteomics researchers do not round masses when attempting to interpret spectra. For example, amino acids K and Q have different molecular composition, and they have different monoisotopic masses (128.09497 Da versus 128.05858 Da), but their integer masses are the same. Since modern mass spectrometers are very accurate, they can detect differences in masses of up to 0.01 Da in order to distinguish K and Q.</p>
- q: If we know the proteome, isn’t it always better to use peptide identification instead of peptide sequencing?
  a: <p>If a spectrum that we analyze originated from a peptide in a proteome, then it makes sense to apply peptide identification via database search and to identify this peptide. However, our knowledge of the proteomes remains incomplete even in the case of a well-studied human proteome. Biologists therefore sometimes use de novo peptide sequencing to discover peptides that do not appear in the currently known (still incomplete) proteome.</p>
- q: Why do we generate the decoy database by assuming that all amino acids have the same frequency (1/20), despite the fact that many proteomes have widely varying amino acid frequencies?
  a: <p>In practice, proteomics researchers do typically generate decoy databases by taking into account amino acid frequencies in the proteome under study. This is often achieved by randomly shuffling the amino acids in real proteins to generate a decoy database.</p>
- q: What is the running time of the dynamic programming algorithm for computing the size of a spectral dictionary?
  a: <p>The algorithm for computing |<em>Dictionary_t</em>(<em>Spectrum</em>)| amounts to filling up the <em>N</em>*<em>M</em> table <em>Size</em>(<em>i</em>, <em>t</em>), where <em>N</em> is the maximum score among all peptides against <em>Spectrum</em> and <em>M</em> is the parent mass of <em>Spectrum</em>. To fill in each element of this table, we need to consider all possible amino acids and apply the equation for <em>Size</em>(<em>i</em>, <em>t</em>) from the section "Spectral Dictionaries".</p>
