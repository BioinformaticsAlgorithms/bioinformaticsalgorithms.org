- q: Can you explain how to select penalties for insertions and deletions?
  a: <p>Indel penalties are often implemented independent of the amino acid types in the inserted or deleted fragment, despite evidence that specific residue types are preferred in gap regions. For example, all indel penalties in the PAM matrix presented in the book are equal to 8, independently of which amino acid is inserted or deleted.</p>
- q: How do we know where the conserved region in a local alignment starts and ends?
  a: <p>If we knew in advance where the conserved region between two strings begins and ends, then we could simply change the source and sink to be the starting and ending nodes of the conserved interval. However, the key point is that we do not know this information in advance. Fortunately, since local alignment adds free taxi rides from the source (0,0) to every node (and from every node to the sink (n, m)) of the alignment graph, it explores all possible starting and ending positions of conserved regions.</p>
- q: How do biologists decide when to use global alignment and when to use local alignment?
  a: <p>Unless biologists have a good reason to align entire strings (e.g., alignment of genes between very close species such as human and chimpanzee), they use local alignment.</p>
- q: Are there advantages of using global alignment instead of local alignment?
  a: <p>Yes. For example, when biologists analyze the evolutionary history of a protein across various species, they often use global alignment. Also, most multiple alignment tools align entire sequences, rather than their substrings, as it is difficult to determine which substrings to align in the case of multiple proteins.</p>
- q: How do we backtrack when computing a local alignment?
  a: '<p>As mentioned in the text, an optimal local alignment fits within a sub-rectangle in the alignment graph. We denote the upper right and bottom left nodes of this sub-rectangle as (i, j) and (i’, j’), respectively.  Unless (i, j) = (0, 0) or (i’, j’) = (n, m), the local alignment corresponds to taking a free taxi ride (i.e., zero-weight edge) from (0, 0) to (i, j), taking one edge at a time to travel from  (i, j) to (i’, j’), and then taking another free taxi ride from (i’, j’) to (n, m).</p>

    <p>We already know that (i’, j’) can be computed as a node such that the score si’, j’ is maximized over all nodes of the entire alignment graph. The question, then, is how to backtrack from this node and to find  (i, j).</p>

    <p>Recall the three backtracking choices from the OutputLCS pseudocode corresponding to the backtracking references ("↓",  "→", and "↘"). To these, we will simply add one additional option, "FREE", which is used when we have used a free taxi ride from the source and will allow us to jump back to (0, 0) when backtracking.  Thus, to find (i, j), one has to backtrack from (i’, j’) until we either reach a coordinate (i, j) with Backtracki, j = "FREE" or until we reach the source (0,0).</p>

    <p>For simplicity, the following LocalAlignment pseudocode assumes that si, j  = -∞ if i &lt; 0 or j &lt; 0.</p>

    <p class="figure"><img src="/assets/images/faq/988d7f_665c642c84d043628f188d8d6866e4ed_mv2.png" alt="Figure" loading="lazy"></p>

    <p>After computing backtracking references, we can compute the source node of the local alignment by invoking LocalAlignmentSource(Backtrack, i'', j''), where (i'', j'') is the sink of the local alignment computed as a node with maximum score among all nodes in the alignment graph. The LocalAlignmentSource pseudocode is shown below.</p>

    <p class="figure"><img src="/assets/images/faq/988d7f_4ed08258aa854f5cb01937695702fb64_mv2.png" alt="Figure" loading="lazy"></p>'
- q: If we have two newly sequenced proteins and don't know how different they are to begin with, how do we know which scoring matrix to use?
  a: <p>Indeed, selection of an appropriate PAMn matrix is tricky, and biologists often use trial-and-error to select the most “reasonable” value of n when considering newly sequenced proteins. For this reason, they devised new BLOSUM matrices that are a bit easier to apply for protein comparison. See <a href="https://currentprotocols.onlinelibrary.wiley.com/doi/abs/10.1002/0471250953.bi0305s43" target="_blank" rel="noopener">W.R. Pearson. Selecting the Right Similarity-Scoring Matrix, Current Protocols in Bioinformatics (2013)</a>.</p>
- q: When building a Manhattan graph in three levels to perform affine sequence alignment, can’t we avoid building the three-level graph by using a two-level graph and keeping track of gap penalties each time we open a gap?
  a: '<p>The problem with this idea is that when computing the score at a node (i, j), we need to take into account the score of closing a gap from every node in the same row and same column. This is exactly what long indel edges do, and what we are trying to avoid in order to reduce the runtime of the algorithm by decreasing the number of edges in the graph.</p>

    <p>For example, the figure below illustrates the two-level Manhattan for computing alignment with affine gap penalties (compare with the 3-level Manhattan shown in the text). At first glance, it looks like it solves the Alignment with Affine Gap Penalties Problem.</p>

    <p class="figure"><img src="/assets/images/faq/988d7f_e1723a73e8f04082a93348f3cbb84c17_mv2.png" alt="Figure" loading="lazy"></p>

    <p>However, it you consider the following alignment with two gaps,</p>

    <p>ATT--AA</p>

    <p>A--GGAA</p>

    <p>you will see that the path through the two-level graph for this alignment (shown below) miscalculates the alignment score; whereas the score of the alignment above is 3-2*(σ+ε), the score of the alignment in the figure below is 3- σ-3*ε.</p>

    <p class="figure"><img src="/assets/images/faq/988d7f_a18941a9b13f43938998694f9fe9f1a2_mv2_d_1904_1508_s_2.png" alt="Figure" loading="lazy"></p>'
- q: When building a Manhattan graph in three levels to perform affine sequence alignment, would it be more natural to connect (i, j)middle to the nodes (i, j)lower and (i, j)upper (instead of connecting them with (i+1, j)lower and (i, j+1)upper?
  a: <p>Connecting (i, j)middle to the nodes (i, j)lower and (i, j)upper (and assigning the edges a score of σ - ε) indeed seems like a more elegant approach to building a three-level Manhattan. However, in this case we would create directed cycles, since there would exist edges from (i, j)lower and (i, j)upper back to (i, j)middle .</p>
- q: How can we backtrack in the three-level Manhattan for alignment with affine gap penalties?
  a: <p>Alignment with affine gap penalties is merely a search for a longest path in a DAG. Thus, backtracking in this graph is no different that backtracking in an arbitrary DAG, starting at the sink and proceeding toward the source according to a topological order. This reduces the problem to identifying a topological order, of which there are several.</p>
- q: In space-efficient sequence alignment, what should we do if there are multiple middle nodes?
  a: '<p>If the array Length(i) has more than one element of maximum value, then you can choose any of them, breaking ties arbitrarily.</p>

    <p>It is also possible for a single longest path to have multiple middle nodes. This occurs if such a path has a vertical edge right after reaching the middle column (i.e., a path that traverses one or more edges in the middle column).</p>'
- q: Why did we switch from finding a middle node to finding a middle edge in space-efficient alignment?
  a: '<p>The shaded parts of the alignment graph to the northwest and southeast of the middle node make up more than half of the total area of the alignment graph. In contrast, the shaded parts of the alignment graph to the northwest and southeast of the middle edge make up less than half of the total area of the alignment graph. This implies that when we divide and conquer based on the middle node, we obtain runtime greater than 2nm, whereas when we divide and conquer based on the middle edge, we obtain runtime less than 2nm.</p>

    <p>Although it may appear that switching from finding a middle node to finding a middle edge results in only a small speed-up and does not affect the asymptotic O(nm) estimate of the running time, it allows us to eliminate some annoying corner cases and simplify the pseudocode.</p>'
- q: Is it possible to develop a linear-space algorithm for alignment with affine gap penalties?
  a: <p>It is possible to extend our idea from pariwise alignment (in order to find a longest common subsequence) to more complex scoring models, e.g., for alignment with affine gap penalties. The only question is where to place the "middle column". It turns out that we need to consider two middle columns to implement the divide-and-conquer linear-space algorithm for alignment with affine gap penalties; try to figure out which ones!</p>
- q: Why are there no edges connecting nodes in the upper level directly to the nodes in lower level in the three-level affine gap penalty alignment graph?
  a: '<p>It appears that the alignment path in the one-level alignment graph shown below, which has a deletion of TT directly followed by an insertion of AA, is best represented by a sequence of edges that includes a direct edge from the lower level to the upper level.</p>

    <p class="figure"><img src="/assets/images/faq/988d7f_8ec15588ef3240f18b3b2d5ae38bb462_mv2.png" alt="Figure" loading="lazy"></p>

    <p>However, such an edge is unnecessary because it can be represented by an edge from the lower to the middle level (weight 0) along with an edge from the middle to the upper level (weight -σ).</p>'
- q: What topological order should we use to move in the three-level Manhattan graph for affine sequence alignment?
  a: '<p>Please consult the following figure, which shows a topological order for a small three-level graph in which we proceed row-by-row in each level. (The topological order corresponds to visiting the nodes in increasing order, from 1 to 36.) Because there are some edges from (i, j)lower to (i, j)middle and from (i, j)upper to (i, j)middle for each i and j, we need to make sure that we visit (i, j)lower and (i, j)upper before (i, j)middle.</p>

    <p class="figure"><img src="/assets/images/faq/988d7f_07d4f17f91a344f29b69d649fb1100b7_mv2_d_1637_1925_s_2.png" alt="Figure" loading="lazy"></p>'
- q: How should we perform initialization for the Alignment with Affine Gap Penalties Problem?
  a: '<p>It may be tricky to determine how to initialize the lower, upper, and middle matrices in the Alignment with Affine Gap Penalties Problem. For this reason, it may be easier to construct a DAG for this problem, approaching it as a general Longest Path in a DAG problem. Since we are interested in paths that start at the node (0,0) in the middle graph, we initialize this node with score 0. However, it is not the only node lacking incoming edges in the three-level graph for the Alignment with Affine Gap Penalties Problem, since the two other nodes lower0,0 and upper0,0 have this property as well. We therefore will initialize these two nodes with score -∞, since valid paths in the alignment graph must start at middle0,0.</p>

    <p>Note also that the recurrence relationships for the the Alignment with Affine Gap Penalties Problem include negative indices. For example, we must compute middlei,-1 before computing middlei,o. We therefore will also set the values of all variables with negative indices to -∞.</p>'
- q: Can I see an illustration of LinearSpaceAlignment?
  a: '<p>Below we illustrate how LinearSpaceAlignment works in the case top = 0, bottom = 8, left = 0, right = 8 shown below:</p>

    <p class="figure"><img src="/assets/images/faq/988d7f_c4392e4ba3bf4d558d3cb6a5dbe6ea40_mv2.png" alt="Figure" loading="lazy"></p>

    <p>The numbers below in blue illustrate how variables change during the execution of LinearSpaceAlignment and result in two recursive calls LinearSpaceAlignment(v, w, 0, 4, 0, 4) and LinearSpaceAlignment(v, w, 5, 8, 5, 8) illustrated by two blue rectangles above. In the case when midEdge is horizontal or diagonal, the left blue rectangle is shifted by one column to the right as compared to the middle column (the line middle ← middle + 1). In the case when midEdge is vertical or diagonal, the left blue rectangle is shifted by one row to the bottom as compared to the position of the middle node (the line midNode ← midNode+1).</p>

    <p class="figure"><img src="/assets/images/faq/988d7f_48d0385879b04514b9a39cad3db77248_mv2.png" alt="Figure" loading="lazy"></p>'
- q: How would we align a nucleotide string of length n against a profile of length k, i.e., against a 4 x m matrix?
  a: <p>Every alignment of a string v against a profile Profile = (PX, j) (for X ∈ {A, C, G, T}, and 1 ≤ j ≤ m) can be represented as a path from (0,0) to (n, m) in the alignment graph. We can define scores of vertical and horizontal edges in this graph as before, i.e., by assigning penalties sigma to indels. There are various ways to assign scores to diagonal edges, e.g, a diagonal edge into a node (i, j) can be assigned a score Pvi, j. After the scores of all edges are specified, an optimal alignment between a string and a profile is computed as a longest path in the alignment graph.</p>
