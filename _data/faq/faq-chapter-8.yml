- q: How do biologists visualize gene expression matrices?
  a: '<p>To make sense of a gene expression matrix, biologists often rearrange its genes so that similar expression vectors correspond to consecutive rows in the gene expression matrix. Then, they often assign colors to each element of the gene expression matrix according to their expression levels, resulting in a heatmap (shown below).</p>

    <p class="figure"><img src="/assets/images/faq/988d7f_dfafe5f0877449c2a4e663ca0864fd90_mv2.png" alt="Figure" loading="lazy"></p>

    <p>Figure: The heatmap of a gene expression matrix. The rows and columns of the gene expression matrix are ordered according to the order of leaves constructed using hierarchical clustering.</p>'
- q: Can I modify FarthestFirstTraversal to solve the k-Means Clustering Problem?
  a: <p>Yes. Simply substitute d(DataPoint, Centers) by Distortion(DataPoint, Centers) in the psesudocode for FarthestFirstTraversal.</p>
- q: What is the running time of the Lloyd algorithm?
  a: <p>The running time of the Lloyd algorithm is proportional to the number of iterations that it requires. Furthermore, each iteration requires O(n*k) distance computations between all data points and all centers, where n is the number of data points and k is the number of centers.</p>
- q: Can the Lloyd algorithm for k-means clustering start from k centers and end up with fewer than k centers?
  a: <p>Yes, it may happen that one of the centers has no data points assigned to it, thus reducing the number of clusters.</p>
- q: Is it possible that two different clusters during the course of the Lloyd algorithm will have the same center of gravity?
  a: '<p>Given a set of k centers in multi-dimensional space, its Voronoi diagram is a partitioning of the space into k regions (called Voronoi cells), each containing exactly one center. A center''s Voronoi cell consists of all points closer to that center than to any other. The figure below (source: <a href="https://en.wikipedia.org/wiki/Voronoi_diagram" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Voronoi_diagram</a>) shows the Voronoi diagram of 20 centers.</p>

    <p class="figure"><img src="/assets/images/faq/988d7f_4e4dad9d1f164dd1a4f8255c67568d27_mv2.png" alt="Figure" loading="lazy"></p>

    <p>For a given center, the Centers to Clusters step of the Lloyd algorithm forms a cluster technically containing all data points in its Voronoi cell. Note that since all points in a cluster are located within a single Voronoi cell, its center of gravity is also located within the same Voronoi cell. Thus, since all Voronoi cells are different, all centers of gravity constructed by the Lloyd algorithm are different. </p>'
- q: Isn’t k-means++Initializer rather slow? And why is it better at initializing data points than FarthestFirstTraversal?
  a: '<p><strong>k-means++Initializer</strong> requires O(n*k) distance computations, where n is the number of data points and k is the number of centers. It therefore results in roughly the same running time as a single iteration of the Lloyd algorithm.</p>

    <p>Since <strong>FarthestFirstTraversal</strong> is a deterministic algorithm, its results are defined by selecting the first center (up to tie resolution). Thus, the number of possible initializations is limited by the number of data points. This may present a limitation if we want to run the Lloyd algorithm many times and select the best solution.</p>'
- q: How many partitions of a set of points into k clusters are there?
  a: '<p>Let {n, k} denote the number of partitions of n points into k clusters. We will establish a recurrence relation to compute {n, k}. To do so, select an arbitrary point x, and note that there are two possibilities. First, x could belong to a cluster all by itself. In this case, the remaining points form k - 1 clusters, and we know that there are {n-1, k-1} ways to partition them. Second, x could belong to a cluster with other points. In this case, there are {n-1, k} ways to partition the other points into k clusters, and then there are k different choices for the cluster to which x belongs.</p>

    <p>Combining these two cases results in the following recurrence relation for all n &gt; 1 and all k satisfying 1 &lt; k &lt; n:</p>

    <p>{n, k} = {n-1, k-1} + k · {n-1, k}</p>

    <p>As for a base case, note that {n, 1} = 1 for all n ≥ 1 because there is only one way to partition n points into a single cluster. By the same reasoning, {n, n} = 1 for all n ≥ 1.</p>

    <p><strong>Exercise Break:</strong> Find a formula for {n, 2} in terms of n.</p>

    <p>The numbers {n, k} are called <strong>Stirling numbers of the second kind</strong>.</p>'
- q: What is the dot product?
  a: '<p>Given two vectors <em>a</em> = (<em>a</em>1, …, <em>an</em>) and <em>b</em> = (<em>b</em>1, …, <em>bn</em>), their dot product is defined as the sum of pairwise products of their elements:</p>

    <p class="figure"><img src="/assets/images/faq/988d7f_59b8bb76336d4719a43eef26c2efabe3_mv2.png" alt="Figure" loading="lazy"></p>

    <p>Note that the two occurrences of the "·" symbol in this equation mean different things. On the left side, it represents the dot product of vectors, which we have just defined. On the right side, it indicates a normal product of two numbers <em>ai</em> and <em>bi</em>.</p>'
- q: Why do we use the logarithms of expression values rather than the expression values themselves?
  a: <p>Before clustering even starts, biologists have to decide how to represent expression vectors in multi-dimensional space. Some representations may result in better clustering outcomes than others (see the FAQ on how scaling the input data affects clustering). It turns out that taking logarithms results in better clustering, but there is no good theoretical justification for this observation.</p>
- q: Why are we interested in analyzing genes whose expression significantly decreases during the course of an experiment?
  a: <p>We are interested in all genes that may be implicated in the diauxic shift. If the expression of a gene decreases during the diauxic shift, then chances are it is still relevant to the diauxic shift. For example, the gene may have to be repressed in order to enable the diauxic shift.</p>
- q: Are there measures in addition to the squared error distortion for evaluating clustering quality?
  a: '<p>The silhouette value is a popular approach for evaluating the quality of clustering. For each point DataPoint, define ClusterDistance(DataPoint) as the average distance between this point and all other points within the same cluster. We also define Distance(DataPoint, Cluster) as the average of the distances from DataPoint to all points in Cluster. The cluster with the minimum distance from a data point (among all clusters that do not contain DataPoint) is called the neighboring cluster for DataPoint. We refer to this distance as NeighborDistance(DataPoint). We define</p>

    <p><em>Separation(DataPoint) = NeighborDistance(DataPoint) - ClusterDistance(DataPoint)</em></p>

    <p>The silhouette value <em>Silhouette(DataPoint)</em> is defined as follows:</p>

    <p><em>Silhouette(DataPoint) = Separation(DataPoint)/max(NeighborDistance(DataPoint), ClusterDistance(DataPoint))</em></p>

    <p>The silhouette value ranges from −1 to +1 and measures how similar a data point is to its own cluster compared to other clusters. A high silhouette value indicates that the data point is well matched to its own cluster and poorly matched to neighboring clusters. If most data points have a high silhouette value, then the clustering is adequate. If many data points have low silhouette values, then the clustering configuration may have too many or too few clusters. The average silhouette value over all data points is a measure of how well the data have been clustered.</p>'
- q: If outliers present so many challenges for clustering, why don’t we simply remove outliers before running clustering algorithms?
  a: <p>To remove outliers, we must first define what we mean by an outlier. It turns out that outlier detection is related to clustering, and so it is not easy to define what an outlier is without clustering! In fact, a common approach to defining outliers is to apply the Lloyd algorithm and list as outliers the top m points that are the farthest away from their nearest cluster centers. However, the Lloyd algorithm itself is sensitive to outliers, and such outliers may have an impact on the clusters that this algorithm constructs. :) Moreover, some outliers may form small tight clusters (e.g., clusters consisting of two data points) that will not be removed by the described procedure. An attempt to remove all small clusters as outliers is also risky, since some small clusters may represent a feature of a dataset rather than an artifact caused by outliers.</p>
- q: How do biologists select the value of k in k-means clustering?
  a: <p>Biologists sometimes use the silhouette analysis to select the value of k (see the previous FAQ on alternate metrics of cluster quality). For example, compute the average silhouette values for k ranging from 1 to some max value and find the maximum silhouette value in this range, and select the associated value of k.</p>
- q: How do we solve the k-center clustering problem for k = 1?
  a: '<p>The 1-center clustering problem is also known as the <strong>Minimum Covering Sphere </strong>Problem: given a set of <em>n</em> data points in <em>m</em>-dimensional space, find an <em>m</em>-dimensional sphere of minimum area containing all these points. In the case of two-dimensional space, the corresponding Minimum Covering "Circle" Problem can be solved in O(<em>n</em>^4) time by considering all triplets of points and capitalizing on the observation that the minimum covering circle for a set of data points is determined by either two points (which represent a diameter of the circle) or three points lying on the boundary of the circle. Thus, we can explore all triples of points. Since checking whether a circle formed by this triple contains all data points takes O(<em>n</em>) time, and we need to check O(<em>n</em>^3) triples, the running time of this algorithm is O(<em>n</em>^4).</p>

    <p>There exists a faster linear time algorithm for solving the Minimum Covering Sphere Problem, proposed in <a href="https://epubs.siam.org/doi/10.1137/0212052" target="_blank" rel="noopener">N. Megiddo. Linear-time algorithms for linear programming in R3 and related problems. SIAM J. on Computing, 12: 759–776 (1983).</a></p>'
- q: If HiddenVector consists of all zeroes, the formula for computing θA in the section “From Coin Flipping to k-Means Clustering” does not work because we have to divide by 0. What should we do?
  a: <p>Since there is no information for estimating θA in this case, you can arbitrarily select θA as a random number in the interval from 0 to 1. Similarly, if HiddenVector consists of all ones, you can arbitrarily select θA  as a random number in the interval from 0 to 1.</p>
- q: Why is the soft clustering algorithm called "Expectation Maximization"?
  a: <p>As explained in the sub-section "Where is the computational problem?", our goal is to find variables that maximize the probability of observing the data Pr(Data|HiddenVector, Parameters).</p>
- q: In contrast to hierarchical clustering, the Lloyd algorithm is run for a fixed number of clusters k, and it is not clear how to select k in advance. Why would we ever select the Lloyd algorithm over hierarchical clustering?
  a: '<p>Running time is one issue. The Lloyd algorithm requires O(n*k) comparisons, where n is the number of data points and k is the number of centers. In contrast, the hierarchical clustering algorithm requires O(n2) comparisons just to compute the distance matrix.</p>

    <p>Also, since the Lloyd algorithm starts with randomly chosen cluster centers, it may yield different clustering results on different runs of the algorithm. Although this lacks consistency, it may have advantages since you can select the best result out of many initializations. With hierarchical clustering, you will obtain the same final tree each time you run the algorithm (up to breaking ties).</p>'
- q: How does scaling the dataset affect the result of clustering?
  a: '<p>Imagine that you want to cluster 1000 people by their height and weight, and suppose that you measure height in centimeters and weight in grams. In this case, one of your authors will be represented by a 2-dimensional point (185,  92137). Since we use the Euclidean distance, which accounts for the height and weight coordinates equally, the weight will dominate the outcome of our clustering algorithm. A better approach would be to represent weight in kilograms, resulting in the point (185, 92) after rounding, but how do we know what the best way is to scale the data?</p>

    <p>A simple generalizable scaling method is based on the formula</p>

    <p><em>x’</em> = (<em>x</em> - min(<em>x</em>)) / (max(<em>x</em>) - min(<em>x</em>)).</p>

    <p>For example, if the height of people in the sample varies from 160 to 200 centimeters, and the weight varies from 40 to 100 kilograms, then the data point (185,92) is rescaled as ((185-160)/40, (92-40)/60).</p>'
- q: We saw that the Lloyd algorithm does not necessarily converge to an optimal solution to the k-Means Clustering Problem. Does the soft k-means clustering algorithm converge to an optimal solution?
  a: <p>No, not necessarily.</p>
- q: Can we use k-means++Initializer for soft k-means clustering?
  a: <p>Of course, feel free to implement it! And it will likely improve your results.</p>
- q: How do we determine an appropriate stiffness parameter?
  a: <p>As with many parametrized algorithms, you should experiment with various values (and check which ones makes sense) as there is no golden rule for determining the stiffness parameter.</p>
- q: What is the stopping rule for the EM algorithm?
  a: <p>In theory, the EM algorithm continues until Parameters cease to change. In practice, it is often stopped when the difference between respective values of Parameters in the previous iteration and the current iteration of the algorithm becomes small. Alternatively, the EM algorithm can be run for a fixed number of iterations.</p>
- q: How do we decide which horizontal line passing through the hierarchical clustering tree results in the best clustering?
  a: <p>In the same way that we select the value of k in k-means clustering See the previous FAQ on how we select a value of k in k-means clustering.</p>
