- q: Why does every tree with n nodes have exactly n − 1 edges?
  a: <p>Take an arbitrary leaf in a tree and delete it along with the edge incident to it. The number of nodes and edges in the resulting smaller tree have both been reduced by 1. Find a leaf in the resulting tree and remove it. The number of nodes and edges in the resulting (even smaller) tree has been reduced by 1 again. We iterate until we obtain a tree consisting of a single node (and no edges). Since we have removed the same number of nodes and edges during this iterative procedure, the number of nodes in the original tree exceeds the number of edges by 1.</p>
- q: Is it possible for the tree produced by AdditivePhylogeny to have a node of degree larger than 3?
  a: <p>Yes. This will happen precisely when the attachment point of a leaf occurs at an existing internal node.</p>
- q: Is it possible for NeighborJoining to produce a tree with a negative edge weight?
  a: <p>Yes. The neighbor-joining algorithm does sometimes assign negative edge weights when given a non-additive matrix. However, for some other non-additive matrices, it produces a tree whose weights are all non-negative (such as the matrix below, which is non-additive, but whose neighbor-joining tree has exclusively positive weights).</p>
- q: How did 18S ribosomal RNA help resolve evolutionary controversies?
  a: '<p>The first large-scale attempt to reconstruct the phylogeny of the entire animal kingdom was based on analyzing 18S RNA (see figure below). Before this work, there were many controversies with respect to the evolutionary relationships between distantly related animals because comparative anatomy and embryology approaches are not very effective for resolving deep branches in animal evolution.</p>

