<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Bioinformatics Algorithms home">
      <span class="brand-bar"></span>
      <span class="brand-text">Bioinformatics<br>Algorithms</span>
    </a>
    <button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav" onclick="var n=document.getElementById('site-nav');var o=n.classList.toggle('open');this.setAttribute('aria-expanded',o)"><span></span><span></span><span></span></button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <div class="nav-group">
          <a href="{{ '/read-the-book' | relative_url }}">Read free</a>
          <div class="nav-menu">
            {% for c in site.data.chapters %}{% if c.free %}
            <a href="{{ '/bioinformatics-chapter-' | append: c.n | append: '/' | relative_url }}"><span class="nav-num">{{ c.n }}</span> {{ c.topic }}</a>
            {% endif %}{% endfor %}
          </div>
        </div>
        <a href="{{ '/lecture-videos' | relative_url }}">Videos</a>
        <a href="{{ '/online-courses' | relative_url }}">Online course</a>
        <a href="{{ '/faq-home' | relative_url }}">FAQ</a>
        <a href="{{ '/authors' | relative_url }}">Authors</a>
        <a href="{{ '/contact' | relative_url }}">Contact</a>
        <a class="btn btn-buy" href="{{ site.buy_url | relative_url }}">Buy the book</a>
      </nav>
  </div>
</header>
